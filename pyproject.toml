[project]
name = "ai-creer-agent"
version = "0.1.0"
description = "A starter career and job-search agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn>=0.41.0",
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.199.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "langchain>=1.3.18",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "lxml>=6.1.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "selenium>=4.48.0",
    "streamlit>=1.62.0",
    "tavily>=1.1.0",
]

[project.scripts]
career-agent = "main:main"
